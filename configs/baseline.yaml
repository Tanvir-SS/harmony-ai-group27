seed: 27
run_id: "run7"

paths:
  gtzan_root: "data/raw/gtzan"
  splits_dir: "data/manifests"   # <- was data/splits
  features_dir: "features"
  model_path: "models/{run_id}_dt.pkl"
  reports_dir: "reports/{run_id}"

features:
  sample_rate: 22050
  n_mfcc: 13
  tempo: true
  use_zcr: true
  use_spectral_centroid: true
  use_chroma: true
  use_rmse: true
  use_spectral_bandwidth: true
  use_spectral_rolloff: true
  use_spectral_contrast: true
  use_tonnetz: true

model:
  type: "DecisionTreeClassifier"
  params:
    criterion: "gini"
    max_depth: 15
    min_samples_split: 5
    min_samples_leaf: 1
    random_state: 42

eval:
  split: "test"
