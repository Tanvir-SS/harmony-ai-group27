seed: 27
run_id: "rf_run1"

paths:
  gtzan_root: "data/raw/gtzan"
  splits_dir: "data/manifests"
  features_dir: "features"
  model_path: "models/{run_id}_rf.pkl"
  reports_dir: "reports/{run_id}"

features:
  
  sample_rate: 22050
  n_mfcc: 13
  tempo: true
  use_zcr: true
  use_spectral_centroid: true
  use_rmse: true
  use_spectral_bandwidth: true
  use_spectral_rolloff: true
  use_chroma: true
  use_spectral_contrast: true
  use_tonnetz: true
  use_mfcc_delta: true
  use_mfcc_delta2: true

model:
  type: "RandomForestClassifier"
  params:
    n_estimators: 300
    max_depth: 20        
    min_samples_split: 2
    min_samples_leaf: 1
    max_features: "sqrt"
    class_weight: "balanced"
    n_jobs: -1
    random_state: 27

eval:
  split: "test"
